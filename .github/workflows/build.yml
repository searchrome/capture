name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: swift --version
      - name: Build debug
        run: swift build
      - name: Test missing API key handling
        run: swift test
      - name: Build and verify release app
        env:
          CODESIGN_IDENTITY: "-"
        run: scripts/build-app.sh release
      - name: Check whitespace
        run: git diff --check
